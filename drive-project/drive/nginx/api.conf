server {
    listen 80;
    server_name _;  # Replace with your domain: api.yourdomain.com
    
    # Redirect HTTP to HTTPS (uncomment after SSL setup)
    # return 301 https://$server_name$request_uri;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # API Backend
    location / {
        proxy_pass http://localhost:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts for large file uploads
        proxy_connect_timeout 600;
        proxy_send_timeout 600;
        proxy_read_timeout 600;
        send_timeout 600;
        
        # File upload size limit (adjust as needed)
        client_max_body_size 100M;
    }

    # Health check endpoint (bypass auth)
    location /health {
        proxy_pass http://localhost:8081;
        access_log off;
    }

    # Metrics endpoint (restrict access in production)
    location /metrics {
        # Uncomment to restrict to localhost only
        # allow 127.0.0.1;
        # deny all;
        proxy_pass http://localhost:8081;
    }
}

